name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-validate:
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test --scratch-path .build/ci-test

      - name: Build release with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors --scratch-path .build/ci-build

      - name: Validate release resources and scripts
        run: |
          zsh -n Scripts/build-app.sh Scripts/build-app-store-pkg.sh Scripts/build-app-icon.sh
          plutil -lint Resources/Info.plist
          plutil -lint Resources/PrivacyInfo.xcprivacy
          plutil -lint Resources/Skreen2Go.entitlements
          plutil -lint Resources/*.lproj/InfoPlist.strings
          plutil -lint Sources/Skreen2GoCore/Resources/*.lproj/Localizable.strings
          test -f Resources/AppIcon.icns
          git diff --check
